<style>
/* =========================================================
   INSTITUT AL MAARIFA — DESIGN SYSTEM
   Palette : vert profond / émeraude / doré / blanc cassé
   Typographies : Fraunces + Karla
   ========================================================= */

:root {
  --deep-green: #0B3B2C;
  --deep-green-2: #092E22;
  --emerald: #1F7A50;
  --emerald-l: #E7F1EB;
  --gold: #B8903E;
  --gold-l: #F4E7CB;
  --cloth: #F7F7F2;
  --white: #FFFFFF;
  --ink: #16211C;
  --ink-soft: #4B5751;
  --line: #E1E4DE;

  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-text: "Karla", "Helvetica Neue", Arial, sans-serif;

  --radius-s: 6px;
  --radius-m: 14px;

  --shadow-1:
    0 1px 2px rgba(11, 59, 44, 0.06),
    0 8px 24px -12px rgba(11, 59, 44, 0.18);

  --shadow-2:
    0 20px 48px -20px rgba(11, 59, 44, 0.35);

  --wrap: 1180px;
}


/* =========================================================
   RESET
   ========================================================= */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: var(--font-text);
  color: var(--ink);
  background: var(--cloth);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

img {
  max-width: 100%;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

button,
input,
textarea,
select {
  font: inherit;
}


/* =========================================================
   TYPOGRAPHIE
   ========================================================= */

h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  color: var(--deep-green);
  line-height: 1.14;
  margin: 0 0 0.5em;
  font-weight: 600;
  letter-spacing: -0.01em;
}

h1 {
  font-size: clamp(2.3rem, 4.4vw, 3.6rem);
  font-weight: 600;
}

h2 {
  font-size: clamp(1.7rem, 3vw, 2.4rem);
}

h3 {
  font-size: 1.28rem;
}

p {
  margin: 0 0 1em;
  max-width: 64ch;
  color: var(--ink-soft);
}


/* =========================================================
   CONTENEUR / SECTIONS
   ========================================================= */

.container {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 24px;
}

section {
  padding: 88px 0;
}

@media (max-width: 720px) {
  section {
    padding: 56px 0;
  }
}


/* =========================================================
   ACCESSIBILITÉ
   ========================================================= */

a:focus-visible,
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.visually-hidden {
  position: absolute;
  left: -9999px;
  top: auto;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

.visually-hidden:focus {
  position: fixed;
  left: 16px;
  top: 16px;
  width: auto;
  height: auto;
  z-index: 999;
  background: #fff;
  color: var(--deep-green);
  padding: 10px 16px;
  border-radius: 8px;
  box-shadow: var(--shadow-2);
}


/* =========================================================
   REDUCTION DES ANIMATIONS
   ========================================================= */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}


/* =========================================================
   BOUTONS
   ========================================================= */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5em;

  padding: 14px 26px;

  border-radius: var(--radius-s);
  border: 1px solid transparent;

  font-family: var(--font-text);
  font-weight: 700;
  font-size: 0.98rem;

  cursor: pointer;
  white-space: nowrap;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    background 0.15s ease;
}

.btn:active {
  transform: translateY(1px);
}

.btn-gold {
  background: var(--gold);
  color: var(--white);
}

.btn-gold:hover {
  background: #a37f36;
  box-shadow: var(--shadow-1);
}

.btn-outline {
  background: transparent;
  border-color: rgba(255, 255, 255, 0.55);
  color: var(--white);
}

.btn-outline:hover {
  background: rgba(255, 255, 255, 0.12);
}

.btn-line {
  background: transparent;
  border-color: var(--deep-green);
  color: var(--deep-green);
}

.btn-line:hover {
  background: var(--emerald-l);
}

.btn-whatsapp {
  background: #1F7A50;
  color: #fff;
}

.btn-whatsapp:hover {
  background: #175f3e;
}

.btn-block {
  width: 100%;
}


/* =========================================================
   HEADER
   ========================================================= */

.site-header {
  position: sticky;
  top: 0;
  z-index: 60;

  background: rgba(247, 247, 242, 0.94);
  backdrop-filter: blur(8px);

  border-bottom: 1px solid var(--line);
}

.nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;

  padding: 14px 24px;

  max-width: var(--wrap);
  margin: 0 auto;
}


/* =========================================================
   LOGO / BRAND
   ========================================================= */

.brand {
  display: flex;
  align-items: center;
  gap: 12px;

  min-width: 0;
}

.brand img {
  height: 46px;
  width: 46px;

  object-fit: contain;
  border-radius: 8px;

  flex-shrink: 0;
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;

  min-width: 0;
}

.brand-text strong {
  font-family: var(--font-display);
  color: var(--deep-green);
  font-size: 1.05rem;
}

.brand-text span {
  font-size: 0.72rem;
  color: var(--ink-soft);
  letter-spacing: 0.03em;
}


/* =========================================================
   NAVIGATION DESKTOP
   ========================================================= */

.main-nav {
  display: flex;
  align-items: center;
  gap: 2px;

  flex-wrap: nowrap;
}

.main-nav a {
  position: relative;

  padding: 10px 14px;

  font-size: 0.94rem;
  font-weight: 600;
  color: var(--ink);

  border-radius: var(--radius-s);

  transition:
    color 0.2s ease,
    background 0.2s ease;
}

.main-nav a:hover {
  color: var(--emerald);
  background: rgba(31, 122, 80, 0.05);
}

.main-nav a.active {
  color: var(--deep-green);
}

.main-nav a.active::after {
  content: "";

  position: absolute;

  left: 14px;
  right: 14px;
  bottom: 4px;

  height: 2px;

  background: var(--gold);
}


/* =========================================================
   ACTIONS HEADER
   ========================================================= */

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-actions .btn {
  padding: 10px 18px;
  font-size: 0.88rem;
}


/* =========================================================
   MENU BURGER
   ========================================================= */

.burger {
  display: none;

  width: 44px;
  height: 44px;

  border-radius: var(--radius-s);
  border: 1px solid var(--line);

  background: var(--white);

  cursor: pointer;

  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 4px;

  flex-shrink: 0;
}

.burger span {
  width: 20px;
  height: 2px;

  background: var(--deep-green);

  display: block;

  transition:
    transform 0.2s ease,
    opacity 0.2s ease;
}


/* =========================================================
   MENU MOBILE
   ========================================================= */

.mobile-nav {
  display: none;

  flex-direction: column;
  gap: 2px;

  padding: 8px 24px 18px;

  background: var(--cloth);

  border-bottom: 1px solid var(--line);
}

.mobile-nav a {
  padding: 12px 6px;

  font-weight: 600;

  border-bottom: 1px solid var(--line);
}

.mobile-nav .header-actions {
  margin-top: 10px;

  flex-direction: column;
}

.mobile-nav .header-actions .btn {
  width: 100%;
}

body.nav-open .mobile-nav {
  display: flex;
}

body.nav-open .burger span:nth-child(1) {
  transform: translateY(6px) rotate(45deg);
}

body.nav-open .burger span:nth-child(2) {
  opacity: 0;
}

body.nav-open .burger span:nth-child(3) {
  transform: translateY(-6px) rotate(-45deg);
}


/* =========================================================
   RESPONSIVE HEADER
   ========================================================= */

@media (max-width: 1100px) {
  .main-nav a {
    padding-left: 9px;
    padding-right: 9px;
    font-size: 0.86rem;
  }
}

@media (max-width: 960px) {
  .main-nav,
  .header-actions {
    display: none;
  }

  .burger {
    display: flex;
  }
}


/* =========================================================
   PAGE HERO
   ========================================================= */

.page-hero {
  background:
    linear-gradient(
      120deg,
      var(--deep-green),
      var(--deep-green-2)
    );

  color: #fff;

  padding: 74px 0 56px;
}

.page-hero h1 {
  color: #fff;
  margin-bottom: 10px;
}

.page-hero p {
  color: #DCEAE1;
  max-width: 60ch;
}

.crumb {
  font-size: 0.85rem;
  color: var(--gold-l);
  font-weight: 700;
  margin-bottom: 10px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;

  margin-top: 28px;
}


/* =========================================================
   PAGE BANNER
   ========================================================= */

.page-banner {
  position: relative;

  min-height: 420px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  background:
    linear-gradient(
      rgba(7, 45, 28, 0.72),
      rgba(7, 45, 28, 0.82)
    ),
    var(--deep-green);

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  color: #fff;

  overflow: hidden;
}

.page-banner h1 {
  color: #fff;

  margin-bottom: 10px;

  font-size: clamp(2.5rem, 5vw, 4rem);
}

.page-banner p {
  color: #DCEAE1;

  max-width: 60ch;

  margin: 0 auto;
}

@media (max-width: 720px) {
  .page-banner {
    min-height: 340px;

    padding: 60px 0;

    background-position: center;
  }
}


/* =========================================================
   EYEBROW
   ========================================================= */

.page-banner .eyebrow {
  display: block;

  font-family: var(--font-display);
  font-style: italic;

  font-size: 1.1rem;

  color: var(--gold-l);

  margin-bottom: 16px;
}

.page-banner .eyebrow strong {
  color: #8FE0B8;

  font-style: normal;
  font-weight: 700;
}


/* =========================================================
   DIVIDER
   ========================================================= */

.page-banner .divider {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  margin: 0 auto 22px;

  width: 180px;
}

.page-banner .divider::before,
.page-banner .divider::after {
  content: "";

  flex: 1;

  height: 1px;

  background: rgba(143, 224, 184, 0.55);
}

.page-banner .divider span {
  width: 8px;
  height: 8px;

  background: #8FE0B8;

  transform: rotate(45deg);

  flex: 0 0 auto;
}


/* =========================================================
   FIL D'ARIANE
   ========================================================= */

.page-banner .crumb {
  font-size: 0.9rem;

  font-weight: 600;

  margin: 18px 0 0;

  color: #CFE3D8;
}

.page-banner .crumb a {
  color: #8FE0B8;
  font-weight: 700;
}

.page-banner .crumb a:hover {
  text-decoration: underline;
}

.page-banner .crumb .sep {
  margin: 0 8px;
  color: rgba(255, 255, 255, 0.5);
}

.page-banner .crumb .current {
  color: #fff;
  font-weight: 700;
}


/* =========================================================
   HEADERS DE SECTION
   ========================================================= */

.section-head {
  max-width: 640px;

  margin-bottom: 44px;
}

.section-head.center {
  max-width: 640px;

  text-align: center;

  margin-left: auto;
  margin-right: auto;
}

.section-head .kicker {
  color: var(--emerald);

  font-weight: 700;

  font-size: 0.9rem;

  margin-bottom: 8px;

  display: block;
}


/* =========================================================
   GRILLES
   ========================================================= */

.grid {
  display: grid;
  gap: 26px;
}

.grid-2 {
  grid-template-columns: repeat(2, 1fr);
}

.grid-3 {
  grid-template-columns: repeat(3, 1fr);
}

.grid-4 {
  grid-template-columns: repeat(4, 1fr);
}

@media (max-width: 920px) {
  .grid-3,
  .grid-4 {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .grid-2,
  .grid-3,
  .grid-4 {
    grid-template-columns: 1fr;
  }
}


/* =========================================================
   CARTES
   ========================================================= */

.card {
  background: var(--white);

  border: 1px solid var(--line);

  border-radius: var(--radius-m);

  overflow: hidden;

  box-shadow: var(--shadow-1);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-2);
}

.card-body {
  padding: 22px;
}

.card h3 {
  margin-bottom: 8px;
}


/* =========================================================
   IMAGES
   ========================================================= */

.img-slot {
  position: relative;

  width: 100%;

  aspect-ratio: 4 / 3;

  background:
    linear-gradient(
      135deg,
      var(--emerald-l),
      var(--cloth)
    );

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-bottom: 1px solid var(--line);
}

.img-slot img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.img-slot .placeholder-icon {
  color: var(--emerald);

  opacity: 0.55;

  width: 42px;
  height: 42px;
}

.img-slot .placeholder-label {
  position: absolute;

  bottom: 10px;
  left: 10px;
  right: 10px;

  font-size: 0.72rem;

  font-weight: 700;

  color: var(--deep-green);

  background: rgba(255, 255, 255, 0.85);

  padding: 6px 8px;

  border-radius: 6px;

  text-align: center;
}

.img-slot.landscape {
  aspect-ratio: 16 / 9;
}

.img-slot.square {
  aspect-ratio: 1 / 1;
}

.img-slot.tall {
  aspect-ratio: 3 / 4;
}

.img-slot.is-empty {
  background:
    linear-gradient(
      135deg,
      var(--emerald-l),
      var(--cloth)
    );
}


/* =========================================================
   VALEURS
   ========================================================= */

.value-item {
  display: flex;

  gap: 16px;

  align-items: flex-start;
}

.value-icon {
  flex: 0 0 auto;

  width: 48px;
  height: 48px;

  border-radius: 12px;

  background: var(--emerald-l);

  display: flex;

  align-items: center;
  justify-content: center;

  color: var(--emerald);
}

.value-item p {
  font-size: 0.94rem;
}


/* =========================================================
   STATISTIQUES
   ========================================================= */

.stat-strip {
  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 24px;

  background: var(--deep-green);

  color: #fff;

  border-radius: var(--radius-m);

  padding: 36px 28px;
}

.stat-strip .n {
  font-family: var(--font-display);

  font-size: 2.1rem;

  color: var(--gold-l);

  margin-bottom: 3px;
}

.stat-strip .l {
  font-size: 0.85rem;

  color: #CFE3D8;
}

@media (max-width: 720px) {
  .stat-strip {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .stat-strip {
    grid-template-columns: 1fr;
  }
}


/* =========================================================
   TIMELINE
   ========================================================= */

.timeline {
  position: relative;

  padding-left: 28px;

  border-left: 2px solid var(--line);
}

.timeline-item {
  position: relative;

  padding-bottom: 36px;
}

.timeline-item:last-child {
  padding-bottom: 0;
}

.timeline-item::before {
  content: "";

  position: absolute;

  left: -34px;
  top: 4px;

  width: 12px;
  height: 12px;

  border-radius: 50%;

  background: var(--gold);

  border: 3px solid var(--cloth);

  box-shadow:
    0 0 0 2px var(--gold);
}

.timeline-item .date {
  display: block;

  font-weight: 700;

  color: var(--emerald);

  font-size: 0.88rem;

  margin-bottom: 4px;
}


/* =========================================================
   ÉQUIPE
   ========================================================= */

.team-card {
  text-align: center;
}

.team-card .img-slot {
  aspect-ratio: 1 / 1;

  border-radius: 50%;

  border: none;

  max-width: 180px;

  margin: 0 auto 16px;
}

.team-card h3 {
  margin-bottom: 2px;
}

.team-card .role {
  color: var(--emerald);

  font-weight: 700;

  font-size: 0.88rem;
}


/* =========================================================
   FORMULAIRES
   ========================================================= */

.form-grid {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 18px;
}

@media (max-width: 640px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
}

.form-group {
  display: flex;

  flex-direction: column;

  gap: 6px;
}

.form-group label {
  font-weight: 700;

  font-size: 0.88rem;

  color: var(--deep-green);
}

.form-group.full {
  grid-column: 1 / -1;
}

.field {
  width: 100%;

  padding: 13px 14px;

  border: 1px solid var(--line);

  border-radius: var(--radius-s);

  font-family: var(--font-text);

  font-size: 0.96rem;

  background: #fff;

  color: var(--ink);

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}

.field:focus {
  border-color: var(--emerald);

  box-shadow:
    0 0 0 3px rgba(31, 122, 80, 0.1);

  outline: none;
}

textarea.field {
  resize: vertical;

  min-height: 120px;
}


/* =========================================================
   FOOTER
   ========================================================= */

.site-footer {
  background: var(--deep-green-2);

  color: #CFE3D8;

  padding: 60px 0 26px;
}

.footer-grid {
  display: grid;

  grid-template-columns:
    1.4fr
    1fr
    1fr
    1fr;

  gap: 36px;
}

@media (max-width: 820px) {
  .footer-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 520px) {
  .footer-grid {
    grid-template-columns: 1fr;
  }
}

.site-footer h4 {
  color: #fff;

  font-size: 0.95rem;

  margin-bottom: 14px;
}

.site-footer a {
  color: #CFE3D8;

  display: block;

  padding: 6px 0;

  font-size: 0.92rem;

  transition: color 0.2s ease;
}

.site-footer a:hover {
  color: var(--gold-l);
}

.site-footer p {
  color: #CFE3D8;
}

.footer-bottom {
  border-top: 1px solid rgba(255, 255, 255, 0.12);

  margin-top: 40px;

  padding-top: 22px;

  font-size: 0.82rem;

  display: flex;

  justify-content: space-between;

  flex-wrap: wrap;

  gap: 10px;

  color: #9DB6A9;
}

.footer-brand {
  display: flex;

  gap: 12px;

  align-items: center;

  margin-bottom: 14px;
}

.footer-brand img {
  height: 40px;

  width: 40px;

  object-fit: contain;
}

.footer-brand strong {
  color: #fff;

  font-family: var(--font-display);
}


/* =========================================================
   WHATSAPP FLOTTANT
   ========================================================= */

.wa-float {
  position: fixed;

  bottom: 22px;
  right: 22px;

  z-index: 80;

  width: 58px;
  height: 58px;

  border-radius: 50%;

  background: #1F7A50;

  display: flex;

  align-items: center;
  justify-content: center;

  box-shadow: var(--shadow-2);

  color: #fff;

  transition:
    transform 0.2s ease,
    background 0.2s ease;
}

.wa-float:hover {

/* =========================================================

.reveal {

  transition:

.split {

  gap: 56px;

}

.chip-row {

<script>

/* ===== Menu burger mobile ===== */
(function(){
  var burger = document.getElementById('burgerBtn');
  var body = document.body;
  if(!burger) return;

  burger.addEventListener('click', function(){
    var isOpen = body.classList.toggle('nav-open');
    burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    burger.setAttribute('aria-label', isOpen ? 'Fermer le menu' : 'Ouvrir le menu');
  });

  document.querySelectorAll('.mobile-nav a').forEach(function(link){
    link.addEventListener('click', function(){
      body.classList.remove('nav-open');
      burger.setAttribute('aria-expanded', 'false');
      burger.setAttribute('aria-label', 'Ouvrir le menu');
    });
  });

  window.addEventListener('resize', function(){
    if(window.innerWidth > 960){
      body.classList.remove('nav-open');
      burger.setAttribute('aria-expanded', 'false');
    }
  });
})();

/* ===== Animation reveal-on-scroll ===== */
(function(){
  document.documentElement.classList.add('js-ready');
  var items = document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('in');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    items.forEach(function(el){ obs.observe(el); });
  } else {
    items.forEach(function(el){ el.classList.add('in'); });
  }
})();
</script>
